<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMart POS System</title>
    <link rel="stylesheet" href="pj2/assets/css/csspos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="pos-container">
        <!-- Left Panel: Product Catalog -->
        <main class="products-section">
            <header class="top-bar">
                <div class="brand">
                    <div class="brand-logo">J</div>
                    <h1>JMart POS</h1>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search products..." onkeyup="filterProducts()">
                </div>
            </header>

            <!-- Category Filters -->
            <div class="categories" id="category-container">
                <button class="cat-btn active" onclick="filterCategory('all', event)">All Items</button>
                <button class="cat-btn" onclick="filterCategory('drinks', event)">Drinks</button>
                <button class="cat-btn" onclick="filterCategory('snacks', event)">Snacks</button>
                <button class="cat-btn" onclick="filterCategory('bakery', event)">Bakery</button>
            </div>

            <!-- Product Grid -->
            <div class="product-grid" id="product-grid">
                <!-- Items populated by JavaScript -->
            </div>
        </main>

        <!-- Right Panel: Cart & Order Summary -->
        <aside class="cart-section">
            <div class="cart-header">
                <h2><i class="fa-solid fa-cart-shopping"></i> Current Order</h2>
            </div>
            
            <div class="cart-items" id="cart-items">
                <p class="empty-msg">No items added yet.</p>
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal-val">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (10%)</span>
                    <span id="tax-val">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total-val">$0.00</span>
                </div>

                <div class="cart-actions">
                    <button class="btn btn-clear" onclick="clearCart()">Clear</button>
                    <button class="btn btn-pay" onclick="openPaymentModal()">Pay Now</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Payment Modal -->
    <div class="modal" id="payment-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePaymentModal()">&times;</span>
            <div class="modal-header">
                <div class="brand-logo sm">J</div>
                <h2>Checkout</h2>
            </div>
            <div class="modal-body">
                <div class="due-box">
                    <span>Total Due</span>
                    <strong id="modal-total">$0.00</strong>
                </div>
                <div class="input-group">
                    <label for="cash-received">Cash Received ($)</label>
                    <input type="number" id="cash-received" placeholder="0.00" oninput="calculateChange()">
                </div>
                <div class="change-box">
                    <span>Change:</span>
                    <span id="change-val">$0.00</span>
                </div>
                <button class="btn btn-pay btn-block" onclick="processPayment()">Print Receipt</button>
            </div>
        </div>
    </div>

    <!-- Printable Receipt -->
    <div id="receipt-print-area" class="receipt-print">
        <h2>JMART SUPERSTORE</h2>
        <p class="receipt-subtitle">Official Receipt</p>
        <p id="receipt-date"></p>
        <hr>
        <div id="receipt-items"></div>
        <hr>
        <div class="receipt-row"><span>Total:</span><span id="receipt-total"></span></div>
        <div class="receipt-row"><span>Cash:</span><span id="receipt-cash"></span></div>
        <div class="receipt-row"><span>Change:</span><span id="receipt-change"></span></div>
        <hr>
        <p class="center">Thank you for shopping at JMart!</p>
    </div>

    <script src="HTMLJAVACSS/pj2/js/javapos.js"></script>
</body>
</html>
